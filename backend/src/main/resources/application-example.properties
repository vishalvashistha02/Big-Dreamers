# =============================================================================
# Big Dreamers Spring Boot Configuration Template
# Placeholders only - do not put real credentials in this file
# =============================================================================

spring.application.name=backend

# ─── MySQL DataSource Placeholders ───────────────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/big_dreamers?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true
spring.datasource.username=your_username
spring.datasource.password=your_password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ─── JPA / Hibernate ─────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=false

# ─── Server ──────────────────────────────────────────────────────────────────
server.port=8080
